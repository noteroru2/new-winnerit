name: SEO build and index policy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_SITE_URL: https://winnerit.in.th
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit complete build graph; verify standalone production Worker boundary
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-full-audit.json || true
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('artifacts/security/npm-full-audit.json','utf8'));
          assert(data.metadata?.vulnerabilities && Number.isInteger(data.metadata.vulnerabilities.high),'npm advisory feed unavailable');
          console.log('BUILD_GRAPH_ADVISORIES_NOT_RUNTIME_CLEARANCE '+JSON.stringify(data.metadata.vulnerabilities));
          NODE
          node scripts/check-worker-runtime-boundary.mjs
      - name: Preserve complete npm audit for scoped remediation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winnerit-build-dependency-audit
          path: artifacts/security/npm-full-audit.json
          retention-days: 30
          if-no-files-found: warn
      - name: Audit editorial content
        run: npm run seo:audit-content > seo-content-audit.json
      - name: Publish evidence gate
        run: npm run seo:publish-guard
      - name: Review queue report
        run: npm run seo:review-inventory > seo-review-inventory.json
      - name: Test Worker APIs
        run: npm run test:worker
      - name: Build production HTML
        run: npm run build
      - name: Verify SEO output and sitemap safety
        run: npm run seo:check-output

      - name: Upload non-sensitive SEO review inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-review-inventory
          path: seo-review-inventory.json
          retention-days: 14
          if-no-files-found: ignore
