name: Winner IT storefront truth and SEO quarantine
on:
  pull_request:
    paths:
      - "src/pages/index.astro"
      - "src/pages/about.astro"
      - "src/pages/contact.astro"
      - "src/config/business.ts"
      - "src/layouts/Layout.astro"
      - "scripts/qa-winner-store-truth.mjs"
      - ".github/workflows/winner-store-truth.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winner-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/qa-winner-store-truth.mjs
      - run: npm run build
